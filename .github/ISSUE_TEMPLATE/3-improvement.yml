name: 🔧 Improvement
description: Something already works, but it could be substantially better.
title: "[Improvement]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Feature vs. Improvement:** if Neutrino Photos *can't* do X, file a Feature Request. If it *does* X but it's slow, awkward, or confusing, you're in the right place.

        Good examples: faster scrolling through photos, better keyboard handling, clearer error messages, lower memory use, fewer taps to reach something.

  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What does the app do today?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed improvement
      description: What should it do instead?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What's the concrete impact — time lost, confusion caused, workflow blocked?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of Neutrino Photos is this about?
      multiple: true
      options:
        - Timeline / library
        - Photo viewer
        - Video playback
        - Importing from the device library
        - Automatic backup
        - Albums
        - Favorites, archive and trash
        - Editing
        - Sharing
        - Search
        - Places
        - People
        - Memories
        - Offline mode
        - Encryption / vault
        - Sign-in / account
        - Settings
        - Other / Not sure
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Screenshots or examples
      description: Optional. Before/after sketches, examples from other apps, timing measurements.

  - type: input
    id: related
    attributes:
      label: Related issues
      placeholder: "#123, #456"
