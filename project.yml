name: NeutrinoPhotos
packages:
  swift-sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: "0.9.1"
  # The code shared with the other Neutrino iOS apps: account identity, the
  # OAuth/PKCE flow, the E2EE key lifecycle and the sign-in screens.
  #
  # A local path, so the two repositories have to sit side by side. Swap this for
  # `url:` + `from:` once neutrino_shared_ios is pushed and tagged.
  NeutrinoShared:
    path: ../neutrino_shared_ios
options:
  bundleIdPrefix: com.neutrino
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16"

targets:
  NeutrinoPhotos:
    type: application
    platform: iOS
    sources:
      - path: NeutrinoPhotos
    dependencies:
      # XChaCha20-Poly1305 secretstream and `crypto_box_seal` — the same primitives the web
      # app encrypts an upload with, so a photo taken here opens there and vice versa.
      - package: swift-sodium
        product: Sodium
      - package: NeutrinoShared
        product: NeutrinoCore
      - package: NeutrinoShared
        product: NeutrinoAuth
      - package: NeutrinoShared
        product: NeutrinoCrypto
      - package: NeutrinoShared
        product: NeutrinoUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutrino.photos
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        DEVELOPMENT_TEAM: "46KWJJ63FU"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: NeutrinoPhotos/NeutrinoPhotos.entitlements
      properties:
        # Cross-app Keychain access group, declared by all six Neutrino apps. Holds the
        # identity keyring and nothing else — sessions stay namespaced per app — so a key
        # imported in one app is a key the others already have. See
        # NeutrinoAppConfig.sharedIdentityGroup in neutrino_shared_ios.
        keychain-access-groups:
          # This app's own group first, and it must stay first: the *default* access group — where
          # an item written without an explicit group lands — is the first entry in this list. Left
          # implicit, adding the shared group below would silently make it the default and start
          # writing this app's access and refresh tokens into a container the other five can read.
          - $(AppIdentifierPrefix)$(CFBundleIdentifier)
          - $(AppIdentifierPrefix)com.neutrino.shared
        # Universal Links: `https://www.getneutrino.app/open/photo/<id>` should open here rather
        # than in Safari. Both host spellings are claimed so a link pasted without the "www."
        # still resolves. Which *paths* reach this app is decided by the apple-app-site-association
        # document served from the domain — see `deploy/apple-app-site-association` in the Drive
        # repository — not by this list. The app ignores inbound links until FeatureFlags.appLinks
        # is turned on and a router exists to handle them.
        #
        # `webcredentials:` is what lets the vault's passkey unlock work. A passkey enrolled on the
        # web is bound to that page's domain as its relying party, and iOS will only hand this app
        # such a credential once the domain's apple-app-site-association names it under
        # `webcredentials` — a server-side file, not something this project can supply. Until it
        # does, a passkey assertion fails with a domain error and `VaultUnlockView` falls back to
        # the password path, which is why the option is offered but never the only one.
        com.apple.developer.associated-domains:
          - applinks:www.getneutrino.app
          - applinks:getneutrino.app
          - webcredentials:www.getneutrino.app
          - webcredentials:getneutrino.app
    info:
      path: NeutrinoPhotos/Info.plist
      properties:
        CFBundleName: Photos
        CFBundleDisplayName: Photos
        # Without these, xcodegen writes literal "1.0"/"1" into Info.plist and the
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION build settings are ignored.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # actool writes only the *nested* CFBundleIcons > CFBundlePrimaryIcon >
        # CFBundleIconName. The top-level key is normally added by Xcode's Info.plist
        # generation, which this target doesn't use (it has an explicit Info.plist), so declare
        # it here — App Store Connect rejects the upload with error 90713 without it.
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The key QR scanner in `NeutrinoUI`'s shared `KeyImportView` drives the camera through
        # `DataScannerViewController`, so this app needs the string even though nothing else here
        # takes a picture. Without it the scan sheet terminates the process rather than prompting.
        NSCameraUsageDescription: "Neutrino Photos needs camera access to scan the QR code that carries your encryption key."
        # Import runs through SwiftUI's `PhotosPicker`, which selects out of process and hands
        # back only what the user picked — that needs no photo-library authorization. This string
        # covers the *other* direction: saving a photo back to the device's library from the
        # viewer.
        NSPhotoLibraryAddUsageDescription: "Neutrino Photos needs permission to save a photo back to your device's photo library."
        # Read access, which is optional and offered rather than demanded — see
        # `DevicePhotoLibrary`. It buys the things a picked item's bytes cannot carry: the capture
        # date of a screenshot, a favorite flag, a Live Photo's paired video, and the RAW file a
        # camera wrote rather than the JPEG the picker renders from it. It is also what Epic 6's
        # full-library import and Epic 7's automatic backup will need. Requesting it without this
        # string is a crash, not a denial.
        NSPhotoLibraryUsageDescription: "Neutrino Photos reads your photo library so imported photos keep their original dates, locations, favorites, Live Photo motion, and RAW originals."
        # Suppresses the recurring system alert that offers to widen a limited-access selection.
        # The app drives that prompt itself, from Settings › Photo Library › Select More Photos,
        # so without this the user gets both — one they asked for and one they did not.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Required alongside CFBundleDocumentTypes or App Store Connect rejects the upload with
        # ITMS-90737. False, not true: a key file is read once and its contents copied into the
        # keychain — the app never edits the document, so it has no use for in-place access to the
        # user's original file.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Neutrino Photos Key File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.neutrino.photos.keyfile
            UTTypeConformsTo:
              - public.json
            UTTypeDescription: Neutrino Photos Key File
            UTTypeTagSpecification:
              public.filename-extension:
                - json

  NeutrinoPhotosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeutrinoPhotosTests
    dependencies:
      - target: NeutrinoPhotos
    settings:
      base:
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
